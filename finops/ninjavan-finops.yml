description: >-
  FinOps view of Ninja Van spend. Unlike a metered SaaS API, the ninjaAPI itself
  carries no per-call fee - it is the integration surface for a physical
  last-mile delivery service. Cost is driven by the delivery service consumed:
  primarily a per-parcel shipping charge that varies by country, service level,
  weight, dimensions, and delivery zone/distance, plus ancillary charges such as
  cash-on-delivery handling, returns, remote-area surcharges, and any negotiated
  account terms. Because pricing is country-specific and set in a merchant rate
  card, per-unit rates are not reconciled here.
notes: >-
  Verify current per-parcel rates and surcharges against the Ninja Van rate card
  for each operating country (SG, MY, ID, PH, VN, TH). API usage does not itself
  generate an invoice; parcels shipped do.
