meters:
- name: parcels_shipped
  description: Parcels shipped, charged per parcel by country, service level, weight, and zone.
  unit: parcels
  aggregation: sum
  dimensions:
  - account
  - country
  - service_level
- name: cash_on_delivery
  description: Cash-on-delivery amounts collected and remitted, potentially with a handling fee.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - country
- name: returns
  description: Return-to-sender parcels, which may carry a separate return charge.
  unit: parcels
  aggregation: sum
  dimensions:
  - account
  - country
- name: surcharges
  description: Ancillary surcharges (remote area, oversized/bulky, redelivery attempts).
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - country
principles:
- name: Visibility
  description: Track parcels shipped and their status per country and service level; reconcile against the Ninja Van rate card.
- name: Allocation
  description: Tag orders with merchant order references so shipping cost maps to internal channels or storefronts.
- name: Optimization
  description: Use the Tariff API to estimate price before creating orders; consolidate parcels, right-size packaging, and reduce failed deliveries and returns to lower per-parcel cost.
- name: Accountability
  description: Assign owners per storefront/country; review monthly shipping spend against forecast and rate card.
