name: Ninja Van
kind: company
description: Ninja Van is a Southeast Asian last-mile logistics and parcel-delivery
  company operating across Singapore, Malaysia, Indonesia, Philippines, Vietnam, and
  Thailand. Its ninjaAPI lets merchants and e-commerce platforms integrate shipping
  programmatically - create and cancel delivery orders, generate waybills (AWB),
  estimate tariffs, look up Ninja Point (PUDO) drop-off locations, receive parcel
  status updates via webhooks, and pull tracking events. The API is country-scoped
  (the country code is part of the path, e.g. https://api.ninjavan.co/SG/...) and
  authenticated with OAuth2 client credentials; access is granted per merchant after
  an onboarding and integration audit.
